name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Fail this run to test the triage path"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Intentional demo failure
        if: ${{ inputs.force_failure }}
        run: |
          echo "Intentional failure requested for the OpenComputer triage demo" >&2
          exit 1
