name: Triage failed GitHub Actions

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  triage:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect failed-step logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_id=$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid workflow run ID" >&2
            exit 1
          fi

          gh run view "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --log-failed > "$RUNNER_TEMP/failed-steps.log" || true

          original_bytes=$(wc -c < "$RUNNER_TEMP/failed-steps.log")
          head -c 24000 "$RUNNER_TEMP/failed-steps.log" \
            > "$RUNNER_TEMP/failed-steps-truncated.log"
          if (( original_bytes > 24000 )); then
            logs_truncated=true
          else
            logs_truncated=false
          fi

          jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson logsTruncated "$logs_truncated" \
            --rawfile failedLogs "$RUNNER_TEMP/failed-steps-truncated.log" \
            '{
              text: "Triage this failed GitHub Actions run and publish the report to Slack.",
              payload: {
                event: "github.actions.workflow.failed",
                repository: $repository,
                workflow: .workflow_run.name,
                runId: .workflow_run.id,
                runAttempt: .workflow_run.run_attempt,
                runNumber: .workflow_run.run_number,
                eventName: .workflow_run.event,
                headBranch: .workflow_run.head_branch,
                headSha: .workflow_run.head_sha,
                actor: .workflow_run.actor.login,
                url: .workflow_run.html_url,
                createdAt: .workflow_run.created_at,
                updatedAt: .workflow_run.updated_at,
                failedLogs: $failedLogs,
                logsTruncated: $logsTruncated
              }
            }' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/opencomputer-payload.json"

      - name: Start OpenComputer triage session
        env:
          OPENCOMPUTER_WEBHOOK_URL: ${{ secrets.OPENCOMPUTER_WEBHOOK_URL }}
          OPENCOMPUTER_WEBHOOK_TOKEN: ${{ secrets.OPENCOMPUTER_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail

          run_id=$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")
          run_attempt=$(jq -r '.workflow_run.run_attempt' "$GITHUB_EVENT_PATH")
          response_file="$RUNNER_TEMP/opencomputer-response.json"

          status=$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST "$OPENCOMPUTER_WEBHOOK_URL" \
            --header "Authorization: Bearer $OPENCOMPUTER_WEBHOOK_TOKEN" \
            --header 'Content-Type: application/json' \
            --header "Idempotency-Key: github-actions-${run_id}-${run_attempt}" \
            --data-binary "@$RUNNER_TEMP/opencomputer-payload.json")

          if [[ "$status" != "202" ]]; then
            echo "OpenComputer webhook returned HTTP $status" >&2
            jq '{error, message}' "$response_file" 2>/dev/null || true
            exit 1
          fi

          jq '{sessionId, sessionUrl}' "$response_file"
